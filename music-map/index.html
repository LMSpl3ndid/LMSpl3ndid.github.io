<!doctype html>
<html lang="zh-CN">
<head>

  <script src="https://unpkg.com/lucide@0.468.0/dist/umd/lucide.min.js"></script>
  <style>
    :root { --ink:#18211d; --muted:#66716b; --paper:#f6f8f2; --line:#d6ddd2; --panel:#ffffff; --green:#1e6f50; --coral:#cf5b43; --yellow:#d9a735; --blue:#2a728c; --soft-green:#dcebe1; --soft-coral:#f8e5df; --shadow:0 12px 32px rgba(24,33,29,.10); }

    body { margin:0; font-family:ui-sans-serif, -apple-system, BlinkMacSystemFont, "Segoe UI", "PingFang SC", "Microsoft YaHei", sans-serif; color:var(--ink); background:var(--paper); }
    button, textarea { font:inherit; }

    .brand span { color:var(--muted); font-size:14px; }
    .head-actions { display:flex; gap:8px; align-items:center; }
    .icon-button { display:grid; place-items:center; width:36px; height:36px; border:1px solid var(--line); border-radius:6px; color:var(--ink); background:var(--panel); }
    .icon-button:hover { color:var(--green); border-color:var(--green); }
    .icon-button svg { width:17px; height:17px; }
    main { max-width:1500px; margin:0 auto; padding:clamp(24px,4vw,54px); }
    .intro { display:flex; justify-content:space-between; align-items:end; gap:28px; margin-bottom:28px; }
    .eyebrow { margin:0 0 8px; color:var(--green); font-size:12px; font-weight:700; letter-spacing:1.2px; text-transform:uppercase; }
    .intro h2 { max-width:760px; margin:0; font-size:clamp(28px,4vw,46px); line-height:1.15; font-weight:650; letter-spacing:0; }
    .intro p:last-child { max-width:310px; margin:0; color:var(--muted); font-size:14px; line-height:1.65; }
    .layout { display:grid; grid-template-columns:minmax(0,1.5fr) minmax(320px,.72fr); gap:28px; align-items:start; }
    .map-area { position:relative; min-height:590px; background:var(--panel); border:1px solid var(--line); border-radius:8px; overflow:hidden; box-shadow:var(--shadow); }
    #map { display:block; width:100%; min-height:590px; background:#edf4ee; }
    .country { fill:#d7e1d8; stroke:#fff; stroke-width:.55px; transition:fill .14s ease, opacity .14s ease; }
    .country.has-entry { fill:#b9d9c4; cursor:pointer; }
    .country.has-entry:hover, .country.has-entry.selected { fill:var(--coral); }
    .country.unavailable { opacity:.72; }
    .map-key { position:absolute; bottom:16px; left:18px; display:flex; align-items:center; gap:10px; padding:9px 11px; border:1px solid var(--line); border-radius:5px; background:rgba(255,255,255,.92); font-size:12px; color:var(--muted); }
    .swatch { width:10px; height:10px; background:#b9d9c4; border-radius:50%; }
    .hover-card { position:absolute; z-index:2; width:min(290px,calc(100% - 28px)); padding:15px 16px; pointer-events:none; border:1px solid var(--line); border-radius:7px; background:var(--panel); box-shadow:var(--shadow); opacity:0; transform:translateY(6px); transition:opacity .12s, transform .12s; }
    .hover-card.show { opacity:1; transform:translateY(0); }
    .hover-card strong { display:block; margin-bottom:4px; font-size:15px; }
    .hover-card span { display:block; color:var(--muted); font-size:12px; line-height:1.45; }
    .detail { min-height:590px; background:var(--panel); border:1px solid var(--line); border-radius:8px; box-shadow:var(--shadow); overflow:hidden; }
    .detail-top { padding:24px 24px 18px; border-bottom:1px solid var(--line); }
    .detail-top .region { margin:0 0 7px; color:var(--green); font-size:12px; font-weight:700; letter-spacing:1px; text-transform:uppercase; }
    .detail-top h3 { margin:0; font-size:27px; line-height:1.2; letter-spacing:0; }
    .detail-top .note { margin:10px 0 0; color:var(--muted); font-size:13px; line-height:1.55; }
    .albums { padding:8px 0; }
    .album { padding:18px 24px 20px; border-bottom:1px solid var(--line); }
    .album:last-child { border-bottom:0; }
    .album-meta { display:flex; gap:11px; align-items:flex-start; }
    .album-mark { flex:0 0 34px; height:34px; display:grid; place-items:center; margin-top:2px; border-radius:5px; color:var(--panel); background:var(--green); }
    .album:nth-child(2) .album-mark { background:var(--coral); }
    .album:nth-child(3) .album-mark { background:var(--blue); }
    .album-mark svg { width:16px; }
    .album-info { min-width:0; flex:1; }
    .album-title-row { display:flex; align-items:flex-start; justify-content:space-between; gap:10px; }
    .album h4 { margin:0; font-size:16px; line-height:1.35; font-weight:650; }
    .artist { margin:3px 0 0; color:var(--muted); font-size:13px; }
    .year { flex:0 0 auto; color:var(--muted); font-size:12px; }
    .tags { display:flex; flex-wrap:wrap; gap:5px; margin-top:10px; }
    .tag { padding:3px 7px; border-radius:4px; background:var(--soft-green); color:var(--green); font-size:11px; }
    .review-label { display:flex; align-items:center; justify-content:space-between; gap:10px; margin:15px 0 6px; color:var(--muted); font-size:12px; }
    .done { display:flex; align-items:center; gap:5px; white-space:nowrap; color:var(--green); }
    .done input { accent-color:var(--green); }
    textarea { display:block; width:100%; min-height:52px; resize:vertical; padding:9px 10px; color:var(--ink); border:1px solid var(--line); border-radius:5px; background:#fbfcf9; outline:none; font-size:13px; line-height:1.45; }
    textarea:focus { border-color:var(--green); box-shadow:0 0 0 3px rgba(30,111,80,.13); }

    .empty svg { width:32px; height:32px; margin:0 auto 14px; color:var(--green); }
    .empty p { max-width:230px; margin:0; line-height:1.6; font-size:14px; }
    .footer { display:flex; justify-content:space-between; align-items:center; gap:18px; margin-top:25px; color:var(--muted); font-size:12px; }
    .footer-actions { display:flex; gap:8px; }
    .text-button { border:0; padding:0; background:none; color:var(--green); font-size:12px; text-decoration:underline; text-underline-offset:3px; }
    .toast { position:fixed; z-index:3; left:50%; bottom:24px; padding:10px 14px; border-radius:6px; color:#fff; background:var(--ink); box-shadow:var(--shadow); font-size:13px; opacity:0; transform:translate(-50%,10px); pointer-events:none; transition:opacity .18s, transform .18s; }
    .toast.show { opacity:1; transform:translate(-50%,0); }
    @media (max-width:900px) { .intro { align-items:start; flex-direction:column; } .layout { grid-template-columns:1fr; } .detail, .empty { min-height:auto; } .empty { min-height:230px; } }
    @media (max-width:560px) { .site-head { align-items:flex-start; } .brand { flex-direction:column; gap:2px; } .brand span { font-size:12px; } main { padding:24px 16px; } #map, .map-area { min-height:430px; } .detail-top, .album { padding-left:18px; padding-right:18px; } .footer { align-items:flex-start; flex-direction:column; } }
  </style>
</head>

        <div id="hoverCard" class="hover-card" aria-hidden="true"></div>

      <aside id="detail" class="detail" aria-live="polite"></aside>

  <div id="toast" class="toast" role="status" aria-live="polite"></div>

      '344': ['香港','东亚', '粤语流行的黄金时代与实验独立场景都不可错过。', [['乐与怒','Beyond','1993','粤语摇滚,摇滚'],['Di-Dar','王菲','1995','粤语流行,另类流行']]],
      '360': ['印度尼西亚','东南亚', 'dangdut、独立流行与迷幻摇滚共同构成群岛的节奏。', [['Badai Pasti Berlalu','Chrisye','1977','流行,印尼'],['Mantra-Mantra','Kunto Aji','2018','独立流行,创作歌手']]],
      '764': ['泰国','东南亚', '传统 luk thung 和当代独立流行之间有鲜活的连续性。', [['Made in Thailand','Carabao','1984','泰国摇滚,民谣'],['Manchild','Phum Viphurit','2017','独立流行,灵魂乐']]],
      '704': ['越南','东南亚', '抒情歌曲的传统与新一代独立音乐正在彼此照亮。', [['Diễm Xưa','Khánh Ly','1968','越南流行,抒情'],['Giấc Mơ Của Tôi','Tùng Dương','2010','流行,实验']]],
      '608': ['菲律宾','东南亚', 'OPM 把吉他流行、灵魂乐和英美影响化成自己的语言。', [['Cutterpillow','Eraserheads','1995','另类摇滚,OPM'],['CLAPCLAPCLAP!','IV of Spades','2017','流行摇滚,放克']]],
      '036': ['澳大利亚','大洋洲', '车库摇滚、迷幻和电子流行都有很强的当代感。', [['Since I Left You','The Avalanches','2000','采样,电子'],['Currents','Tame Impala','2015','迷幻流行,摇滚']]],
      '554': ['新西兰','大洋洲', '独立流行和后朋克里常有一种松弛却锋利的质地。', [['Compilation','The Clean','1986','独立摇滚,后朋克'],['True','Avantdale Bowling Club','2018','嘻哈,爵士']]]
    };
    const STORAGE = 'sonic-atlas-reviews-v1';
    const svg = document.querySelector('#map');
    const detail = document.querySelector('#detail');
    const hoverCard = document.querySelector('#hoverCard');
    const mapArea = document.querySelector('.map-area');
    let activeId = '156';
    let reviews = mergeReviews(sharedReviewData.reviews, loadReviews());
    let paths = [];

    function keyFor(id, index) { return `${id}-${index}`; }
    function loadReviews() { try { return JSON.parse(localStorage.getItem(STORAGE)) || {}; } catch { return {}; } }
    function mergeReviews(shared, local) {
      const keys = new Set([...Object.keys(shared || {}), ...Object.keys(local || {})]);
      return Object.fromEntries([...keys].map(key => [key, {...(shared?.[key] || {}), ...(local?.[key] || {})}]));
    }
    function saveReviews() { localStorage.setItem(STORAGE, JSON.stringify(reviews)); updateProgress(); }
    function albumEntries() { return Object.entries(regions).flatMap(([id, region]) => region[3].map((album, index) => ({ id, index, album }))); }
    function updateProgress() { const all = albumEntries(); const count = all.filter(({id,index}) => reviews[keyFor(id,index)]?.done).length; document.querySelector('#progress').textContent = `${count} / ${all.length} 张已听`; }
    function esc(value) { return String(value).replace(/[&<>"]/g, char => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[char])); }
    function renderDetail(id) {
      const region = regions[id];
      activeId = id;
      paths.forEach(({id: pathId, node}) => node.classList.toggle('selected', pathId === id));
      if (!region) { detail.innerHTML = `<div class="empty"><i data-lucide="map-pin" aria-hidden="true"></i><p>这个地区还没有音乐入口。绿色国家已收录推荐，可以先从那里开始。</p></div>`; lucide.createIcons(); return; }
      const [name, area, note, albums] = region;
      detail.innerHTML = `<div class="detail-top"><p class="region">${esc(area)}</p><h3>${esc(name)}</h3><p class="note">${esc(note)}</p></div><div class="albums">${albums.map((album,index) => {
        const [title, artist, year, tagString] = album; const record = reviews[keyFor(id,index)] || {}; const tags = tagString.split(',');
        return `<article class="album"><div class="album-meta"><div class="album-mark"><i data-lucide="disc-3" aria-hidden="true"></i></div><div class="album-info"><div class="album-title-row"><div><h4>${esc(title)}</h4><p class="artist">${esc(artist)}</p></div><span class="year">${esc(year)}</span></div><div class="tags">${tags.map(tag=>`<span class="tag">${esc(tag)}</span>`).join('')}</div></div></div><label class="review-label" for="review-${id}-${index}"><span>我的一句话</span><span class="done"><input class="done-input" data-id="${id}" data-index="${index}" type="checkbox" ${record.done ? 'checked' : ''}>已听</span></label><textarea id="review-${id}-${index}" class="review-input" data-id="${id}" data-index="${index}" maxlength="140" placeholder="写下此刻的感受…">${esc(record.text || '')}</textarea></article>`;
      }).join('')}</div>`;
      detail.querySelectorAll('.review-input').forEach(input => input.addEventListener('input', event => { const {id,index} = event.target.dataset; reviews[keyFor(id,index)] = {...reviews[keyFor(id,index)], text:event.target.value}; saveReviews(); }));
      detail.querySelectorAll('.done-input').forEach(input => input.addEventListener('change', event => { const {id,index} = event.target.dataset; reviews[keyFor(id,index)] = {...reviews[keyFor(id,index)], done:event.target.checked}; saveReviews(); }));
      lucide.createIcons();
    }
    function showHover(id, event) {
      const region = regions[id]; if (!region) return;
      const [name, area,, albums] = region; const first = albums[0];
      hoverCard.innerHTML = `<strong>${esc(name)} <span>· ${esc(area)}</span></strong><span>${esc(first[0])} · ${esc(first[1])}</span><span>${esc(albums.length)} 张推荐专辑，点击查看</span>`;
      const rect = mapArea.getBoundingClientRect(); const x = Math.min(event.clientX - rect.left + 14, rect.width - 300); const y = Math.max(14, event.clientY - rect.top - 92);
      hoverCard.style.left = `${Math.max(14,x)}px`; hoverCard.style.top = `${y}px`; hoverCard.classList.add('show');
    }
    function hideHover() { hoverCard.classList.remove('show'); }
    function toast(message) { const node = document.querySelector('#toast'); node.textContent = message; node.classList.add('show'); clearTimeout(window.toastTimer); window.toastTimer = setTimeout(()=>node.classList.remove('show'), 2200); }
    function exportReviews() { const blob = new Blob([JSON.stringify({version:1, exportedAt:new Date().toISOString(), reviews}, null, 2)], {type:'application/json'}); const url = URL.createObjectURL(blob); const anchor = document.createElement('a'); anchor.href = url; anchor.download = 'sonic-atlas-reviews.json'; anchor.click(); URL.revokeObjectURL(url); toast('简评已导出'); }
    async function importReviews(file) { try { const imported = JSON.parse(await file.text()); if (!imported || typeof imported.reviews !== 'object') throw new Error(); reviews = imported.reviews; saveReviews(); renderDetail(activeId); toast('简评已导入'); } catch { toast('未能读取这个备份文件'); } }
    document.querySelector('#exportButton').addEventListener('click', exportReviews);
    document.querySelector('#exportText').addEventListener('click', exportReviews);
    document.querySelector('#importButton').addEventListener('click', () => document.querySelector('#importInput').click());
    document.querySelector('#importInput').addEventListener('change', event => { if (event.target.files[0]) importReviews(event.target.files[0]); event.target.value = ''; });
    document.querySelector('#homeButton').addEventListener('click', () => renderDetail('156'));
    document.querySelector('#clearText').addEventListener('click', () => { if (confirm('确定清空这台设备上的全部简评和已听记录？')) { reviews = {}; saveReviews(); renderDetail(activeId); toast('本地记录已清空'); } });

    async function drawMap() {
      try {
        const countries = feature(world, world.objects.countries).features;
        const width = 1000, height = 570; svg.setAttribute('viewBox', `0 0 ${width} ${height}`);
        const projection = geoNaturalEarth1().fitSize([width - 36, height - 34], {type:'FeatureCollection', features:countries});
        const path = geoPath(projection); const ns = 'http://www.w3.org/2000/svg';
        countries.forEach(country => { const id = String(country.id).padStart(3, '0'); const node = document.createElementNS(ns, 'path'); node.setAttribute('d', path(country)); node.setAttribute('class', `country ${regions[id] ? 'has-entry' : 'unavailable'}`); node.setAttribute('data-id', id); node.setAttribute('aria-label', regions[id] ? `${regions[id][0]}，${regions[id][3].length} 张推荐专辑` : '暂未收录'); if (regions[id]) { node.addEventListener('mouseenter', event => showHover(id,event)); node.addEventListener('mousemove', event => showHover(id,event)); node.addEventListener('mouseleave', hideHover); node.addEventListener('click', () => renderDetail(id)); node.addEventListener('keydown', event => { if (event.key === 'Enter' || event.key === ' ') { event.preventDefault(); renderDetail(id); } }); node.setAttribute('tabindex','0'); } svg.appendChild(node); paths.push({id,node}); });
      } catch (error) { svg.outerHTML = '<div class="empty"><i data-lucide="cloud-off" aria-hidden="true"></i><p>地图边界未能加载。请检查网络后刷新页面。</p></div>'; lucide.createIcons(); }
    }
    renderDetail(activeId); updateProgress(); drawMap(); lucide.createIcons();
  </script>
</body>
</html>
